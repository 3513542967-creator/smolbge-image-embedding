[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smolbge-image-embedding"
version = "0.1.0"
description = "Direct image embeddings aligned to the BGE-small text embedding space"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "numpy>=1.26",
  "pillow>=10.0",
  "safetensors>=0.4",
  "scikit-learn>=1.4",
  "torch>=2.6",
  "transformers>=5.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110

